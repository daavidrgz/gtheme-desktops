$hypr = ~/.config/hypr
$hl = $hypr/hyprland

# Color scheme (generated by gtheme hyprland-scheme pattern)
source = $hypr/scheme/current.conf
source = $hypr/variables.conf

# User overrides (create manually if needed: ~/.config/caelestia/hypr-vars.conf)
source = ~/.config/caelestia/hypr-vars.conf

# Default monitor
monitor = , preferred, auto, 1.5

# Modular configs
source = $hl/env.conf
source = $hl/general.conf
source = $hl/input.conf
source = $hl/misc.conf
source = $hl/animations.conf
source = $hl/decoration.conf
source = $hl/group.conf
source = $hl/execs.conf
source = $hl/rules.conf
source = $hl/gestures.conf
source = $hl/keybinds.conf

# User configs (create manually if needed: ~/.config/caelestia/hypr-user.conf)
source = ~/.config/caelestia/hypr-user.conf
