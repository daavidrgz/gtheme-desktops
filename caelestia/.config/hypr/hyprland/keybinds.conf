$mainMod = SUPER

exec = hyprctl dispatch submap global
submap = global

# ──────────────────────────────────────
#   CAELESTIA SHELL IPC
# ──────────────────────────────────────

# Launcher (Super+Space, like hypr's rofi)
bind = $mainMod, space, global, caelestia:launcher

# Brightness (via shell OSD)
bindl = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Media (via shell OSD)
bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioPause, global, caelestia:mediaToggle
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop

# Shell panels
bind = $mainMod, A, global, caelestia:showall
bindl = CTRL ALT, C, global, caelestia:clearNotifs
bind = $mainMod, L, global, caelestia:lock

# Screenshots (via shell)
bind = , Print, global, caelestia:screenshotFreeze
bind = $mainMod, Print, exec, caelestia screenshot
# Kill/restart shell
bindr = CTRL+Super+Shift, R, exec, qs -c caelestia kill
bindr = CTRL+Super+Alt, R, exec, qs -c caelestia kill; sleep .1; caelestia shell -d

# ──────────────────────────────────────
#   BASIC (matching hypr desktop)
# ──────────────────────────────────────

# Terminal
bind = $mainMod, Return, exec, $terminal

# Floating terminal
bind = $mainMod ALT, Return, exec, $terminal --class floatingterm

# Reload config
bind = $mainMod, Escape, exec, hyprctl reload

# ──────────────────────────────────────
#   CUSTOM APPS (matching hypr desktop)
# ──────────────────────────────────────

bind = $mainMod, B, exec, brave
bind = $mainMod CTRL, F, exec, firefox
bind = $mainMod, E, exec, $fileExplorer
bind = $mainMod, V, exec, $terminal nvim
bind = $mainMod, Y, exec, $terminal --class floatingterm yazi

# ──────────────────────────────────────
#   HYPRLAND WINDOW MANAGEMENT
# ──────────────────────────────────────

# Quit/Restart
bind = $mainMod ALT, Q, exit,

# Close window
bind = $mainMod, W, killactive,

# Fullscreen
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1

# Window states
bind = $mainMod, T, togglefloating,
bind = $mainMod SHIFT, T, pseudo,
bind = $mainMod, J, togglesplit,

# Pin window
bind = $mainMod, P, pin

# ──────────────────────────────────────
#   FOCUS / SWAP (matching hypr desktop)
# ──────────────────────────────────────

# Focus direction
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# Swap/move window direction
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# Focus next window
bind = ALT, Tab, cyclenext,

# Focus next/previous workspace
bind = $mainMod, bracketleft, workspace, m-1
bind = $mainMod, bracketright, workspace, m+1

# Move window to next/previous workspace
bind = $mainMod SHIFT, bracketleft, movetoworkspace, m-1
bind = $mainMod SHIFT, bracketright, movetoworkspace, m+1

# Focus next/previous monitor
bind = $mainMod ALT, bracketleft, focusmonitor, l
bind = $mainMod ALT, bracketright, focusmonitor, r

# Move window to next/previous monitor
bind = $mainMod ALT SHIFT, bracketleft, movewindow, mon:l
bind = $mainMod ALT SHIFT, bracketright, movewindow, mon:r

# ──────────────────────────────────────
#   WORKSPACES (matching hypr desktop)
# ──────────────────────────────────────

# Focus workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move window to workspace silently
bindd = $mainMod CTRL, code:10, move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod CTRL, code:11, move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod CTRL, code:12, move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod CTRL, code:13, move silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod CTRL, code:14, move silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod CTRL, code:15, move silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod CTRL, code:16, move silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod CTRL, code:17, move silently to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod CTRL, code:18, move silently to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod CTRL, code:19, move silently to workspace 10, movetoworkspacesilent, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

# ──────────────────────────────────────
#   MOVE / RESIZE (matching hypr desktop)
# ──────────────────────────────────────

# Move floating window
bind = $mainMod CTRL, Left, moveactive, -20 0
bind = $mainMod CTRL, Down, moveactive, 0 20
bind = $mainMod CTRL, Up, moveactive, 0 -20
bind = $mainMod CTRL, Right, moveactive, 20 0

# Resize window
bind = $mainMod ALT, Left, resizeactive, -20 0
bind = $mainMod ALT, Down, resizeactive, 0 20
bind = $mainMod ALT, Up, resizeactive, 0 -20
bind = $mainMod ALT, Right, resizeactive, 20 0

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ──────────────────────────────────────
#   SYSTEM (volume via wpctl, not swayosd)
# ──────────────────────────────────────

bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-

# Session menu (matching hypr's Alt+Escape for wlogout)
bind = ALT, Escape, global, caelestia:session
bind = CTRL ALT, Delete, global, caelestia:session

# Color picker
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Clipboard (via fuzzel)
bind = $mainMod ALT, C, exec, pkill fuzzel || caelestia clipboard

# Recording
bind = $mainMod ALT, R, exec, caelestia record -s
bind = CTRL ALT, R, exec, caelestia record

# Sleep
bind = $mainMod SHIFT, L, exec, systemctl suspend-then-hibernate
