# ██████╗ ██╗ ██████╗ ██████╗ ███╗   ███╗
# ██╔══██╗██║██╔════╝██╔═══██╗████╗ ████║
# ██████╔╝██║██║     ██║   ██║██╔████╔██║
# ██╔═══╝ ██║██║     ██║   ██║██║╚██╔╝██║
# ██║     ██║╚██████╗╚██████╔╝██║ ╚═╝ ██║
# ╚═╝     ╚═╝ ╚═════╝ ╚═════╝ ╚═╝     ╚═╝

corner-radius = 10;

#################################
#             Shadows           #
#################################

shadow = false;
shadow-radius = 14;
shadow-opacity = .6

shadow-offset-x = -7;
shadow-offset-y = -5;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading              #
#################################

fading = true
fade-in-step = 0.03
fade-out-step = 0.03
fade-delta = 5

#################################
#   Transparency / Opacity      #
#################################

inactive-opacity = 1
frame-opacity = 0.5

inactive-opacity-override = false
active-opacity = 1.0

inactive-dim = 0.0

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'"
];

#################################
#     Background-Blurring       #
#################################

blur: {
  method = "none"
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       General Settings        #
#################################

backend = "glx";
vsync = true

mark-wmwin-focused = true;
mark-ovredir-focused = false;
detect-rounded-corners = false
detect-client-opacity = true;

detect-transient = true
use-damage = true
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1; }
  dropdown_menu = { opacity = 1; }
};
