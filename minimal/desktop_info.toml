author = 'David Rodríguez (@daavidrgz)'
description = 'A minimal dependency desktop using bspwm and polybar. It has square corners and double borders in windows.'
credits = 'https://github.com/mdnght-4/dotfiles'
dependencies = [
	'wmutils-opt-git',
	'bspwm',
	'sxhkd',
	'picom',
	'rofi',
	'polybar',
	'dunst',
	'pulseaudio',
	'feh',
	'brightnessctl',
	'playerctl',
	'flameshot',
]
optional_dependencies = [
	'alacritty',
	'kitty',
	'firefox',
	'better-discord',
	'spicetify',
]
