source = ~/.config/hypr/colors/colors.conf


################
### MONITORS ###
################

monitor=,preferred,auto,1.5
workspace = 1, monitor:DP-1, default:true


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

exec-once = swww-daemon
exec-once = waybar
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = qs --path ~/.config/quickshell/hypr-overview &
exec-once = qs --path ~/.config/quickshell/hypr-lens &
exec-once = playerctld
exec-once = swayosd-server
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = qs --path ~/.config/quickshell/music &


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 12
    border_size = 1

    col.active_border = $secondary
    col.inactive_border = $outline_variant

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 4
        passes = 3
        vibrancy = 0.5
    }
}

animations {
    enabled = true
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = softSnap, 0.4, 0, 0.2, 1
    bezier = fluent, 0.0, 0.0, 0.2, 1.0
    animation = windows, 1, 5, overshot, popin 80%
    animation = windowsIn, 1, 5, overshot, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 95%
    animation = windowsMove, 1, 4, softSnap
    animation = layersIn, 1, 3, smoothIn, slide
    animation = layersOut, 1, 2, softSnap, slide
    animation = fade, 1, 4, smoothIn
    animation = fadeIn, 1, 4, smoothIn
    animation = fadeOut, 1, 4, smoothOut
    animation = fadeSwitch, 1, 4, smoothIn
    animation = fadeShadow, 1, 4, smoothIn
    animation = fadeDim, 1, 4, smoothIn
    animation = fadeDpms, 1, 4, smoothIn
    animation = workspaces, 1, 5, overshot, slidefade 30%
    animation = specialWorkspace, 1, 5, overshot, slidefadevert 30%
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        scroll_factor = 0.35
    }

    repeat_rate = 40
    repeat_delay = 200

    sensitivity = 0
}

gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

#----------------------
#   BASIC
#----------------------

# Terminal emulator
bind = $mainMod, Return, exec, $terminal

# Terminal emulator (nvidia gpu)
bind = $mainMod SHIFT, Return, exec, prime-run alacritty

# Floating terminal
bind = $mainMod ALT, Return, exec, $terminal --class floatingterm

# Launcher
bind = $mainMod, space, exec, $menu || pkill rofi

# Reload config
bind = $mainMod, Escape, exec, hyprctl reload

#----------------------
#   CUSTOM
#----------------------

bind = $mainMod CTRL, F, exec, firefox
bind = $mainMod, B, exec, brave
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, $terminal nvim
bind = $mainMod, Y, exec, $terminal --class floatingterm yazi
bind = $mainMod, A, exec, swaync-client -t -sw
bind = $mainMod, grave, exec, ~/.config/rofi/scripts/key.sh
bind = $mainMod, L, exec, hyprlock

#----------------------
#   HYPRLAND
#----------------------

# Quit/Restart
bind = $mainMod ALT, Q, exit,
# Close/Kill window
bind = $mainMod, W, killactive,
# Fullscreen
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, fullscreen, 0

# Window states
bind = $mainMod, T, togglefloating,
bind = $mainMod SHIFT, T, pseudo,
bind = $mainMod, J, togglesplit,

#----------------------
#   FOCUS/SWAP
#----------------------

# Focus direction
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# Swap/move window direction
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# Focus next window
bind = ALT, Tab, cyclenext,

# Focus next/previous workspace
bind = $mainMod, bracketleft, workspace, m-1
bind = $mainMod, bracketright, workspace, m+1

# Move window to next/previous workspace
bind = $mainMod SHIFT, bracketleft, movetoworkspace, m-1
bind = $mainMod SHIFT, bracketright, movetoworkspace, m+1

# Focus next/previous monitor
bind = $mainMod ALT, bracketleft, focusmonitor, l
bind = $mainMod ALT, bracketright, focusmonitor, r

# Move window to next/previous monitor
bind = $mainMod ALT SHIFT, bracketleft, movewindow, mon:l
bind = $mainMod ALT SHIFT, bracketright, movewindow, mon:r

# Toggle overview (Mission Control)
bind = $mainMod, Tab, global, quickshell:overviewToggle

#----------------------
#   WORKSPACES
#----------------------

# Focus workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move window to workspace silently
bindd = $mainMod CTRL, code:10, move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod CTRL, code:11, move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod CTRL, code:12, move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod CTRL, code:13, move silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod CTRL, code:14, move silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod CTRL, code:15, move silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod CTRL, code:16, move silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod CTRL, code:17, move silently to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod CTRL, code:18, move silently to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod CTRL, code:19, move silently to workspace 10, movetoworkspacesilent, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

#----------------------
#   MOVE/RESIZE
#----------------------

# Move floating window
bind = $mainMod CTRL, Left, moveactive, -20 0
bind = $mainMod CTRL, Down, moveactive, 0 20
bind = $mainMod CTRL, Up, moveactive, 0 -20
bind = $mainMod CTRL, Right, moveactive, 20 0

# Resize window
bind = $mainMod ALT, Left, resizeactive, -20 0
bind = $mainMod ALT, Down, resizeactive, 0 20
bind = $mainMod ALT, Up, resizeactive, 0 -20
bind = $mainMod ALT, Right, resizeactive, 20 0

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#----------------------
#   QUICKSHELL
#----------------------

# Stash operations
bind = $mainMod SHIFT, V, global, quickshell:stashWorkspace
bind = $mainMod SHIFT, U, global, quickshell:unstashQuick

# Screenshots/tools
bind = $mainMod SHIFT, A, global, quickshell:regionSearch
bind = $mainMod SHIFT, X, global, quickshell:regionOcr
bind = $mainMod SHIFT, R, global, quickshell:regionRecord
bind = $mainMod SHIFT ALT, R, global, quickshell:regionRecordWithSound

# Color picker
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Music panel toggle
bind = $mainMod ALT, M, exec, qs -c ~/.config/quickshell/music msg music toggle

#----------------------
#   WAYBAR/THEME
#----------------------

bind = $mainMod SHIFT, B, exec, ~/.config/waybar/scripts/waybar-theme-rofi.sh
bind = $mainMod ALT, B, exec, ~/.config/waybar/scripts/launch.sh
bind = $mainMod ALT, H, exec, ~/.config/waybar/scripts/hide.sh
bind = $mainMod ALT, W, exec, ~/.config/hypr/wppicker.sh
bind = $mainMod ALT, T, exec, ~/.config/hypr/themepicker.sh
bind = $mainMod ALT, S, exec, ~/.config/hypr/syslauncher.sh

# Clipboard
bind = $mainMod ALT, C, exec, ~/.config/hypr/clip.sh
bind = CTRL ALT, Delete, exec, cliphist wipe | pkill -USR1 rofi

# Wlogout
bind = ALT, Escape, exec, ~/.config/hypr/scripts/Wlogout.sh

#----------------------
#   SYSTEM
#----------------------

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness +10
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -10

# Screenshots (fallback)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER, Print, exec, grim - | wl-copy


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps
windowrule {
    name = windowrule-1
    suppress_event = maximize
    match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
    name = windowrule-2
    no_focus = on
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = 1
    match:fullscreen = 0
    match:pin = 0
}

windowrule {
    name = windowrule-3
    tag = +multimedia_video
    match:class = ^([Mm]pv|vlc)$
}

windowrule {
    name = windowrule-4
    tag = +settings
    match:class = ^(nm-applet|nm-connection-editor|blueman-manager|org.gnome.FileRoller)$
}

windowrule {
    name = windowrule-5
    tag = +settings
    match:class = ^(org.gnome.DiskUtility|wihotspot(-gui)?)$
}

windowrule {
    name = windowrule-6
    tag = +viewer
    match:class = ^(org.gnome.SystemMonitor)$
}

windowrule {
    name = windowrule-7
    tag = +viewer
    match:class = ^(org.gnome.Evince)$
}

windowrule {
    name = windowrule-8
    tag = +viewer
    match:class = ^(eog|org.gnome.Loupe)$
}

windowrule {
    name = windowrule-9
    no_blur = on
    opacity = 1.0
    float = on
    size = 900 506
    match:tag = multimedia_video*
}

windowrule {
    name = windowrule-10
    opacity = 0.8
    float = on
    match:tag = settings*
}

windowrule {
    name = windowrule-11
    opacity = 0.8
    match:class = ^(org.gnome.Nautilus|code-insiders|thunar)$
}

windowrule {
    name = windowrule-12
    opacity = 0.8
    match:class = ^(gedit|org.gnome.TextEditor|geany)$
}

windowrule {
    name = windowrule-13
    opacity = 0.8
    float = on
    size = (monitor_w*0.5) (monitor_h*0.6)
    match:class = ^(org.pulseaudio.pavucontrol)$
}

windowrule {
    name = windowrule-14
    opacity = 0.9
    match:class = ^(kitty)$
}

windowrule {
    name = windowrule-15
    opacity = 0.8
    workspace = 4 silent
    match:class = ^(spotify)$
}

windowrule {
    name = windowrule-17
    opacity = 0.8
    workspace = 5 silent
    match:class = ^(org.telegram.desktop)$
}

windowrule {
    name = windowrule-18
    opacity = 0.8
    match:class = ^(brave-browser)$
}

windowrule {
    name = windowrule-19
    opacity = 1.0
    match:class = ^(brave-browser)$
    match:title = .*YouTube.*
}

windowrule {
    name = windowrule-20
    opacity = 1.0
    match:class = ^(brave-browser)$
    match:title = .*HiAnime.*
}

windowrule {
    name = windowrule-21
    opacity = 1.0
    match:class = ^(brave-browser)$
    match:title = .*1Flix.*
}

windowrule {
    name = windowrule-22
    float = on
    center = on
    border_size = 0
    stay_focused = on
    match:class = ^(flameshot)$
}

# Floating terminal
windowrule {
    name = windowrule-23
    float = on
    center = on
    size = (monitor_w*0.6) (monitor_h*0.6)
    opacity = 0.8
    match:class = ^(floatingterm)$
}

windowrule {
    name = windowrule-24
    workspace = 2
    match:class = ^(code-insiders)$
}

windowrule {
    name = windowrule-25
    workspace = 2
    match:class = ^(geany)$
}

windowrule {
    name = windowrule-26
    opacity = 0.8
    border_size = 0
    match:class = ^(music.py)$
}

windowrule {
    name = windowrule-27
    float = on
    match:tag = viewer*
}

# Pop-ups and dialogues
windowrule {
    name = windowrule-28
    float = on
    size = (monitor_w*0.5) (monitor_h*0.6)
    center = on
    match:title = ^(Save As|Save a File|Pick Files)$
}

windowrule {
    name = windowrule-29
    float = on
    size = (monitor_w*0.7) (monitor_h*0.6)
    match:initial_title = (Open File)
}

windowrule {
    name = windowrule-30
    float = on
    size = (monitor_w*0.7) (monitor_h*0.6)
    match:initial_title = (All Files)
}

windowrule {
    name = windowrule-31
    float = on
    size = (monitor_w*0.35) (monitor_h*0.45)
    match:class = (hyprmixer)
}

windowrule {
    name = windowrule-32
    float = on
    size = (monitor_w*0.7) (monitor_h*0.6)
    match:class = (xdg-desktop-portal-gtk)
}

windowrule {
    name = windowrule-33
    float = on
    size = (monitor_w*0.7) (monitor_h*0.6)
    match:class = (feh)
}


##################
### LAYER RULES ##
##################

layerrule {
    name = layerrule-1
    blur = on
    ignore_alpha = 0.5
    animation = popin 60%
    match:namespace = rofi
}

layerrule {
    name = layerrule-2
    blur = on
    ignore_alpha = 0
    match:namespace = notifications
}

layerrule {
    name = layerrule-3
    blur = on
    ignore_alpha = 0.5
    match:namespace = waybar
}

layerrule {
    name = layerrule-4
    ignore_alpha = 0.5
    match:namespace = tag:notif*
}

layerrule {
    name = layerrule-5
    blur = on
    animation = slide top, 1, 2, smoothIn
    match:namespace = logout_dialog
}

# Swaync blur & xray
layerrule {
    name = layerrule-6
    blur = on
    ignore_alpha = 0.5
    xray = 0
    animation = slide right 60%
    match:namespace = swaync-control-center
}

layerrule {
    name = layerrule-7
    blur = on
    ignore_alpha = 0.5
    xray = 0
    animation = slide 60%
    match:namespace = swaync-notification-window
}
