general {
    lock_cmd = pidof hyprlock || hyprlock  # the 10s listener below powers off the display while locked.
    before_sleep_cmd = pidof hyprlock || hyprlock  # lock directly on suspend (NOT via lock_cmd) so no deferred dpms-off survives resume.
    after_sleep_cmd = ~/.config/hypr/scripts/hyprdispatch 'hl.dsp.dpms({ action = "on" })' dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 240                                 # 4min.
    on-timeout = brightnessctl -s set 10          # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                  # monitor backlight restore.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 310                                 # 5min 10s
    on-timeout = ~/.config/hypr/scripts/hyprdispatch 'hl.dsp.dpms({ action = "off" })' dpms off        # screen off when timeout has passed
    on-resume = ~/.config/hypr/scripts/hyprdispatch 'hl.dsp.dpms({ action = "on" })' dpms on          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 10                                  # 10s, only acts while hyprlock is up
    on-timeout = pidof hyprlock && ~/.config/hypr/scripts/hyprdispatch 'hl.dsp.dpms({ action = "off" })' dpms off
    on-resume = ~/.config/hypr/scripts/hyprdispatch 'hl.dsp.dpms({ action = "on" })' dpms on
}
